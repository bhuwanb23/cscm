<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6486"/>
    </marker>
  </defs>
  <rect width="1180" height="700" fill="#0b0f1d"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#e6eaf7">Deployment Topology — Render Free Tier</text>
  <line x1="40" y1="76" x2="1140" y2="76" stroke="url(#grad)" stroke-width="3"/>

  <!-- Render box -->
  <rect x="40" y="104" width="1100" height="380" rx="12" fill="#0e1529" stroke="#232d55" stroke-dasharray="6 4"/>
  <text x="60" y="136" font-size="16" font-weight="600" fill="#8b94b8" letter-spacing="2">RENDER · OREGON</text>

  <!-- Services -->
  <rect x="70" y="156" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="90" y="190" font-size="17" font-weight="600" fill="#e6eaf7">cscm-gateway</text>
  <text x="90" y="214" font-size="13" fill="#aab2d0">Node :8080 · proxy + auth</text>
  <text x="90" y="234" font-size="13" fill="#22d3ee">gateway_* metrics</text>

  <rect x="470" y="156" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="490" y="190" font-size="17" font-weight="600" fill="#e6eaf7">cscm-backend</text>
  <text x="490" y="214" font-size="13" fill="#aab2d0">Node :3000 · REST + agents</text>
  <text x="490" y="234" font-size="13" fill="#22d3ee">http_* · cscm_* metrics</text>

  <rect x="870" y="156" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="890" y="190" font-size="17" font-weight="600" fill="#e6eaf7">cscm-aiml</text>
  <text x="890" y="214" font-size="13" fill="#aab2d0">Python :8000 · 17 routers</text>
  <text x="890" y="234" font-size="13" fill="#22d3ee">cscm_ai_* metrics</text>

  <rect x="470" y="290" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="490" y="324" font-size="17" font-weight="600" fill="#e6eaf7">cscm-redis</text>
  <text id="t1" x="490" y="348" font-size="13" fill="#aab2d0">Key-Value · allkeys-lru</text>
  <text x="490" y="368" font-size="13" fill="#8b94b8">pub/sub between services</text>

  <rect x="70" y="290" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="90" y="324" font-size="17" font-weight="600" fill="#e6eaf7">cscm-dashboard</text>
  <text x="90" y="348" font-size="13" fill="#aab2d0">Aurora Console · :3002</text>
  <text x="90" y="368" font-size="13" fill="#8b94b8">serves SPA + proxies APIs</text>

  <rect x="870" y="290" width="240" height="90" rx="10" fill="#1a2344" stroke="#2c3763"/>
  <text x="890" y="324" font-size="17" font-weight="600" fill="#e6eaf7">PostgreSQL</text>
  <text x="890" y="348" font-size="13" fill="#aab2d0">DATABASE_URL · private</text>
  <text x="890" y="368" font-size="13" fill="#8b94b8">migrations auto-run</text>

  <!-- GitHub Actions -->
  <rect x="70" y="412" width="1040" height="56" rx="10" fill="#121a36" stroke="#232d55"/>
  <text x="90" y="446" font-size="14" fill="#aab2d0">GitHub Actions — CI (test · lint · build) · keep-alive pings every 30 min · user simulation · secret scan</text>

  <!-- Local observability -->
  <rect x="40" y="512" width="1100" height="150" rx="12" fill="#121a36" stroke="#232d55"/>
  <text x="60" y="544" font-size="15" font-weight="600" fill="#8b94b8" letter-spacing="2">LOCAL OBSERVABILITY (DOCKER COMPOSE)</text>
  <rect x="70" y="564" width="320" height="72" rx="10" fill="#1a2344" stroke="url(#grad)" stroke-width="1.5"/>
  <text x="90" y="596" font-size="16" font-weight="600" fill="#e6eaf7">Prometheus :9090</text>
  <text x="90" y="620" font-size="13" fill="#aab2d0">scrapes /metrics of all services</text>
  <rect x="430" y="564" width="320" height="72" rx="10" fill="#1a2344" stroke="url(#grad)" stroke-width="1.5"/>
  <text x="450" y="596" font-size="16" font-weight="600" fill="#e6eaf7">Grafana :3001</text>
  <text x="450" y="620" font-size="13" fill="#aab2d0">CSCM System Overview · auto-provisioned</text>
  <text x="790" y="600" font-size="13" fill="#8b94b8">Free tier: services sleep —</text>
  <text x="790" y="620" font-size="13" fill="#8b94b8">monitor locally or via Grafana Cloud</text>

  <!-- Arrows -->
  <line x1="310" y1="201" x2="468" y2="201" stroke="#5b6486" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="201" x2="868" y2="201" stroke="#5b6486" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="246" x2="590" y2="288" stroke="#5b6486" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="246" x2="190" y2="288" stroke="#5b6486" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="380" x2="500" y2="430" stroke="#5b6486" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
