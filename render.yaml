services:
  # Backend API Service
  - type: web
    name: cscm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --only=production
    startCommand: node src/api/server.js
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard (not in public repo)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cscm-redis
          property: connectionString
      - key: AI_ML_API_URL
        value: https://cscm-aiml.onrender.com
      # AI_ML_API_KEY - REQUIRED: set manually in Render dashboard (must match cscm-aiml).
      # The old key was leaked in the repo and must be rotated.
      # - key: AI_ML_API_KEY
      #   sync: false
      - key: GATEWAY_PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: DEBUG
        value: false
      # CORS: browsers can only call the API when allowed origins are configured.
      # Set this in the Render dashboard to your app/web origin(s), comma-separated.
      # - key: ALLOWED_ORIGINS
      #   sync: false

  # AI/ML Service
  - type: web
    name: cscm-aiml
    runtime: python
    rootDir: ai-ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: AI_ML_API_KEY
        generateValue: true
      # GitHub environment variables for model download - set manually in Render dashboard:
      # - key: GITHUB_REPO_OWNER
      #   value: bhuwanb23
      # - key: GITHUB_REPO_NAME
      #   value: cscm
      # - key: GITHUB_RELEASE_TAG
      #   value: v1.0.0

  # API Gateway Service
  - type: web
    name: cscm-gateway
    runtime: node
    rootDir: backend
    buildCommand: npm ci --only=production
    startCommand: node src/gateway/gateway.js
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://cscm-backend.onrender.com
      - key: AI_ML_API_URL
        value: https://cscm-aiml.onrender.com
      # AI_ML_API_KEY - REQUIRED: set manually in Render dashboard (must match cscm-aiml).
      # The old key was leaked in the repo and must be rotated.
      # - key: AI_ML_API_KEY
      #   sync: false
      # SECURITY: REQUIRED - must be the SAME value as the cscm-backend JWT_SECRET,
      # otherwise the gateway cannot validate tokens issued by the backend.
      # - key: JWT_SECRET
      #   sync: false
      - key: DEBUG
        value: false

  # Redis Key Value Instance
  - type: keyvalue
    name: cscm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
