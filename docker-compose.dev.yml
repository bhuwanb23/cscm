version: '3.8'

services:
  # Redis for messaging
  redis:
    image: redis:7-alpine
    container_name: cscm-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cscm-network

  # Backend API Service with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cscm-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ML_API_URL=http://ai-ml:8000
    volumes:
      - backend_data:/app/data
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cscm-network
    restart: unless-stopped
    command: npm run dev

  # AI/ML Service with hot reload
  ai-ml:
    build:
      context: ./ai-ml
      dockerfile: Dockerfile
    container_name: cscm-ai-ml-dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ai_ml_data:/app/data
      - ./ai-ml/api:/app/api
      - ./ai-ml/legacy_models:/app/legacy_models
      - ./ai-ml/requirements.txt:/app/requirements.txt
      - ./ai-ml/hot-reload-config.py:/app/hot-reload-config.py
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cscm-network
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir api --reload-dir legacy_models

  # API Gateway
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    container_name: cscm-gateway-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - GATEWAY_PORT=8080
      - AI_ML_API_URL=http://ai-ml:8000
    depends_on:
      backend:
        condition: service_healthy
      ai-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cscm-network
    restart: unless-stopped

  # Development Dashboard
  dev-dashboard:
    build:
      context: ./dev-dashboard
      dockerfile: Dockerfile
    container_name: cscm-dev-dashboard
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:3000
      - GATEWAY_URL=http://gateway:8080
      - AI_ML_URL=http://ai-ml:8000
    depends_on:
      - backend
      - gateway
      - ai-ml
    networks:
      - cscm-network
    restart: unless-stopped

networks:
  cscm-network:
    driver: bridge

volumes:
  redis_data:
  backend_data:
  ai_ml_data:
