openapi: 3.0.0
info:
  title: Cognitive Supply Chain Mesh Backend API
  version: 1.0.0
  description: |
    Comprehensive API for managing supply chain operations including inventory, orders, shipments, events, and AI/ML integrations.
    
    ## Authentication
    This API supports JWT authentication and API key authentication for service-to-service communication.
    
    ## Rate Limiting
    Rate limits are applied per user and per IP to prevent abuse.
    
    ## Error Handling
    All errors follow a consistent format with error codes and messages.
  
  contact:
    name: CSCM Team
    email: support@cscm.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.cscm.example.com
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: User authentication and authorization
  - name: Inventory
    description: Inventory management
  - name: Orders
    description: Order processing and management
  - name: Shipments
    description: Shipment tracking and management
  - name: Events
    description: Event logging and monitoring
  - name: Analytics
    description: Business analytics and metrics
  - name: Cache
    description: Cache management operations

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API service
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: backend-api
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: object
                    properties:
                      status:
                        type: string
                  cache:
                    type: object
                    properties:
                      status:
                        type: string

  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics endpoint
      description: Returns Prometheus-compatible metrics for monitoring
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with credentials and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
                  description: User password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [admin, shopkeeper, transporter, wholesaler]
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [shopkeeper, transporter, wholesaler]
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/inventory:
    get:
      tags:
        - Inventory
      summary: Get inventory items
      description: Retrieve inventory items with optional filtering
      parameters:
        - name: store_id
          in: query
          schema:
            type: string
          description: Filter by store ID
        - name: product_id
          in: query
          schema:
            type: string
          description: Filter by product ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: Inventory items retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer

    post:
      tags:
        - Inventory
      summary: Create inventory item
      description: Add a new inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItem'
      responses:
        '201':
          description: Inventory item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InventoryItem'

  /api/v1/inventory/{id}:
    get:
      tags:
        - Inventory
      summary: Get inventory item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventory item retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Inventory
      summary: Update inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItem'
      responses:
        '200':
          description: Inventory item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InventoryItem'

    delete:
      tags:
        - Inventory
      summary: Delete inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventory item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: Get orders
      description: Retrieve orders with optional filtering
      parameters:
        - name: store_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

    post:
      tags:
        - Orders
      summary: Create order
      description: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'

  /api/v1/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'

    put:
      tags:
        - Orders
      summary: Update order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'

  /api/v1/shipments:
    get:
      tags:
        - Shipments
      summary: Get shipments
      description: Retrieve shipments with optional filtering
      parameters:
        - name: order_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_transit, delivered, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Shipments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'

    post:
      tags:
        - Shipments
      summary: Create shipment
      description: Create a new shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shipment'
      responses:
        '201':
          description: Shipment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Shipment'

  /api/v1/events:
    get:
      tags:
        - Events
      summary: Get events
      description: Retrieve system events with optional filtering
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'

    post:
      tags:
        - Events
      summary: Create event
      description: Log a new system event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Event'

  /api/v1/analytics/events:
    get:
      tags:
        - Analytics
      summary: Get analytics event data
      description: Retrieve analytics events for business intelligence
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: event_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Analytics data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                  summary:
                    type: object

  /api/v1/analytics/metrics:
    get:
      tags:
        - Analytics
      summary: Get business metrics
      description: Retrieve aggregated business metrics
      parameters:
        - name: metric_type
          in: query
          schema:
            type: string
            enum: [orders, inventory, shipments, revenue]
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /cache/stats:
    get:
      tags:
        - Cache
      summary: Get cache statistics
      description: Retrieve cache performance metrics
      responses:
        '200':
          description: Cache statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      hits:
                        type: integer
                      misses:
                        type: integer
                      hit_rate:
                        type: number
                      size:
                        type: integer

  /cache/clear:
    post:
      tags:
        - Cache
      summary: Clear cache
      description: Clear all cached data
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type/category
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
        timestamp:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required:
        - product_id
        - store_id
        - quantity
      properties:
        id:
          type: string
          description: Unique inventory item ID
        product_id:
          type: string
          description: Product identifier
        store_id:
          type: string
          description: Store/location identifier
        quantity:
          type: integer
          description: Current quantity in stock
        reserved_quantity:
          type: integer
          default: 0
          description: Quantity reserved for orders
        min_stock_level:
          type: integer
          default: 0
          description: Minimum stock threshold
        max_stock_level:
          type: integer
          default: 0
          description: Maximum stock capacity
        unit_cost:
          type: number
          format: float
          description: Cost per unit
        selling_price:
          type: number
          format: float
          description: Selling price per unit
        last_updated:
          type: string
          format: date-time
          description: Last update timestamp

    Order:
      type: object
      required:
        - order_id
        - store_id
      properties:
        id:
          type: string
        order_id:
          type: string
          description: Unique order identifier
        store_id:
          type: string
        customer_id:
          type: string
        total_amount:
          type: number
          format: float
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
              quantity:
                type: integer
              unit_price:
                type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Shipment:
      type: object
      required:
        - order_id
        - tracking_number
      properties:
        id:
          type: string
        order_id:
          type: string
        tracking_number:
          type: string
        carrier:
          type: string
        status:
          type: string
          enum: [pending, in_transit, delivered, cancelled]
        origin:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
        destination:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
        estimated_delivery:
          type: string
          format: date-time
        actual_delivery:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - event_type
        - source
      properties:
        id:
          type: string
        event_type:
          type: string
          description: Type of event
        source:
          type: string
          description: Event source system
        data:
          type: object
          description: Event-specific data
        timestamp:
          type: string
          format: date-time
        user_id:
          type: string
          description: User who triggered the event

security:
  - bearerAuth: []
  - apiKeyAuth: []

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: JWT authentication token
  apiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
    description: API key for service-to-service authentication
