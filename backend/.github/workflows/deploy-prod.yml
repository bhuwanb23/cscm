name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cscm.example.com

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Backend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: cscm-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Build and push Gateway image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: cscm-gateway
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile.gateway backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Build and push AI/ML image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: cscm-ai-ml
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ai-ml
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Database backup before deployment
      run: |
        echo "Creating database backup before production deployment"
        # Add database backup command here
        # Example: kubectl exec -n cscm deployment/backend-deployment -- pg_dump cscm_db > backup.sql

    - name: Deploy to Kubernetes Production
      run: |
        # Update image references in deployment manifests
        sed -i "s|cscm-backend:latest|${{ steps.login-ecr.outputs.registry }}/cscm-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
        sed -i "s|cscm-gateway:latest|${{ steps.login-ecr.outputs.registry }}/cscm-gateway:${{ github.sha }}|g" k8s/gateway-deployment.yaml
        sed -i "s|cscm-ai-ml:latest|${{ steps.login-ecr.outputs.registry }}/cscm-ai-ml:${{ github.sha }}|g" k8s/ai-ml-deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/redis-pvc.yaml
        kubectl apply -f k8s/redis-deployment.yaml
        kubectl apply -f k8s/redis-service.yaml
        kubectl apply -f k8s/backend-pvc.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/ai-ml-pvc.yaml
        kubectl apply -f k8s/ai-ml-deployment.yaml
        kubectl apply -f k8s/ai-ml-service.yaml
        kubectl apply -f k8s/gateway-deployment.yaml
        kubectl apply -f k8s/gateway-service.yaml
        kubectl apply -f k8s/hpa.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Wait for deployment to be ready
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/backend-deployment -n cscm
        kubectl wait --for=condition=available --timeout=300s deployment/ai-ml-deployment -n cscm
        kubectl wait --for=condition=available --timeout=300s deployment/gateway-deployment -n cscm

    - name: Health check
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=ready --timeout=300s pod -l app=gateway -n cscm
        kubectl wait --for=condition=ready --timeout=300s pod -l app=backend -n cscm
        kubectl wait --for=condition=ready --timeout=300s pod -l app=ai-ml -n cscm

    - name: Verify deployment
      run: |
        kubectl get pods -n cscm
        kubectl get services -n cscm
        kubectl get hpa -n cscm

    - name: Integration tests
      run: |
        echo "Running integration tests against production"
        # Add integration test commands here
        # Example: curl -f https://cscm.example.com/health

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed, initiating rollback"
        kubectl rollout undo deployment/backend-deployment -n cscm
        kubectl rollout undo deployment/ai-ml-deployment -n cscm
        kubectl rollout undo deployment/gateway-deployment -n cscm