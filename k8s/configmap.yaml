apiVersion: v1
kind: ConfigMap
metadata:
  name: cscm-config
  namespace: cscm
data:
  # Backend configuration
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  AI_ML_API_URL: "http://ai-ml-service:8000"
  BACKEND_API_URL: "http://backend-service:3000"
  
  # Gateway configuration
  GATEWAY_PORT: "8080"
  
  # AI/ML configuration
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/app"
  
  # Prometheus configuration
  PROMETHEUS_RETENTION: "30d"
  
  # Redis configuration
  REDIS_MAXMEMORY: "256mb"
  REDIS_MAXMEMORY_POLICY: "allkeys-lru"
  
  # Logging configuration
  LOG_LEVEL: "info"