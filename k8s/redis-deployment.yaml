apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: cscm
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      component: cache
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_MAXMEMORY
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: REDIS_MAXMEMORY
        - name: REDIS_MAXMEMORY_POLICY
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: REDIS_MAXMEMORY_POLICY
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "$(REDIS_MAXMEMORY)"
        - --maxmemory-policy
        - "$(REDIS_MAXMEMORY_POLICY)"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 1
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc