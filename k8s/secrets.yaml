apiVersion: v1
kind: Secret
metadata:
  name: cscm-secrets
  namespace: cscm
type: Opaque
stringData:
  # JWT Secret (should be overridden in production)
  JWT_SECRET: "your-super-secret-jwt-key-here"
  JWT_EXPIRATION: "24h"
  
  # Database credentials (if using external database)
  DATABASE_PASSWORD: "your-database-password"
  DATABASE_URI: "sqlite:///app/data/cscm.db"
  
  # Redis password (if authentication is enabled)
  REDIS_PASSWORD: ""
  
  # AI/ML API Key (if external API requires authentication)
  AI_ML_API_KEY: ""
  
  # Grafana admin password
  GRAFANA_ADMIN_PASSWORD: "admin"
  
  # Elasticsearch credentials (if security is enabled)
  ELASTICSEARCH_PASSWORD: ""
  
  # Service account credentials for external integrations
  KAFKA_CLIENT_SECRET: ""
  MQTT_PASSWORD: ""