apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: cscm
  labels:
    app: gateway
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
      component: api-gateway
  template:
    metadata:
      labels:
        app: gateway
        component: api-gateway
    spec:
      containers:
      - name: gateway
        image: cscm-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: NODE_ENV
        - name: GATEWAY_PORT
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: GATEWAY_PORT
        - name: AI_ML_API_URL
          value: "http://ai-ml-service:8000"
        - name: BACKEND_API_URL
          value: "http://backend-service:3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2