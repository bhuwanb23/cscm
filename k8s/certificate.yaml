apiVersion: v1
kind: Secret
metadata:
  name: cscm-tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  # Replace with actual base64 encoded certificate and key
  # tls.crt: LS0tLS1CRUdJTi...
  # tls.key: LS0tLS1CRUdJTi...
---
# For development, use self-signed certificate
# Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt
# Then encode with: base64 -w 0 tls.crt
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@cscm.local
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cscm-certificate
  namespace: default
spec:
  secretName: cscm-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: cscm.local
  dnsNames:
    - cscm.local
    - cscm-gateway.local
    - cscm-backend.local
    - cscm-aiml.local