apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ml-deployment
  namespace: cscm
  labels:
    app: ai-ml
    component: ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-ml
      component: ml-service
  template:
    metadata:
      labels:
        app: ai-ml
        component: ml-service
    spec:
      containers:
      - name: ai-ml
        image: cscm-ai-ml:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: PYTHONUNBUFFERED
        - name: PYTHONPATH
          valueFrom:
            configMapKeyRef:
              name: cscm-config
              key: PYTHONPATH
        - name: AI_ML_API_KEY
          valueFrom:
            secretKeyRef:
              name: cscm-secrets
              key: AI_ML_API_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: ai-ml-data
          mountPath: /app/data
      volumes:
      - name: ai-ml-data
        persistentVolumeClaim:
          claimName: ai-ml-pvc