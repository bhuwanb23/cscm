apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cscm-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
spec:
  ingressClassName: nginx
  rules:
    # Gateway service
    - host: cscm-gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
    # Backend service (direct access)
    - host: cscm-backend.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
    # AI/ML service (direct access)
    - host: cscm-aiml.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-ml-service
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cscm-ingress-path-based
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # Path-based routing through gateway
    - host: cscm.local
      http:
        paths:
          # Gateway routes all traffic
          - path: /(|/.*)
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080