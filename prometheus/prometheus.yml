global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cscm-monitor'

scrape_configs:
  # --- docker-compose services (DNS names resolve inside cscm-network) ---
  - job_name: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'gateway'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'ai-ml'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['ai-ml:8000']

  # --- localhost fallbacks (run Prometheus directly on the host) ---
  - job_name: 'backend-local'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:3000']

  - job_name: 'gateway-local'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'ai-ml-local'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:8000']

  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
