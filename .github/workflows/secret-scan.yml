name: Secret Scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly history scan — Mondays 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scan-worktree:
    name: Scan tracked files for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for credential patterns
        run: |
          set -u
          PATTERNS='(AKIA[0-9A-Z]{16}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|sk_live_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|eyJhbGciOiJIUzI1NiIs[A-Za-z0-9_-]{50,})'

          HITS=$(git ls-files -z | xargs -0 grep -nE "$PATTERNS" 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::Potential secrets detected in tracked files"
            echo "$HITS" | sed 's/^/  /'
            echo ""
            echo "If a real secret leaked: ROTATE IT FIRST, then purge git"
            echo "history (a secret that reaches a remote is compromised)."
            echo "False positives? Tighten the pattern in this workflow."
            exit 1
          fi
          echo "Tracked-file scan clean."

      - name: Fail if env or key files are tracked
        run: |
          set -u
          TRACKED=$(git ls-files | grep -iE '(^|/)\.env($|\.|$)|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa' | grep -viE 'example|\.env\.example' || true)

          if [ -n "$TRACKED" ]; then
            echo "::error::Env/key files must never be committed"
            echo "$TRACKED" | sed 's/^/  /'
            exit 1
          fi
          echo "No env/key files tracked."

      - name: Scan git history for leaks (scheduled + manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -u
          PATTERNS='(AKIA[0-9A-Z]{16}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|sk_live_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|eyJhbGciOiJIUzI1NiIs[A-Za-z0-9_-]{50,})'

          HITS=$(git log --all -p -U0 2>/dev/null | grep -nE "$PATTERNS" | sort -u -t: -k2 || true)

          if [ -n "$HITS" ]; then
            echo "::error::Potential secrets found in git history"
            echo "$HITS" | head -30 | sed 's/^/  /'
            echo ""
            echo "Rotate the secret immediately, then rewrite history"
            echo "(git filter-repo or BFG) and force-push."
            exit 1
          fi
          echo "History scan clean."
