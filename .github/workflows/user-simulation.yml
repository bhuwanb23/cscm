name: User Simulation

on:
  # Run every 2 hours during business hours (9am-6pm UTC)
  schedule:
    - cron: '0 9,11,13,15,17 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --only=production
      
      - name: Run user simulation
        working-directory: ./backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AI_ML_API_URL: ${{ secrets.AI_ML_API_URL }}
          AI_ML_API_KEY: ${{ secrets.AI_ML_API_KEY }}
        run: node src/simulation/index.js --continuous
      
      - name: Generate simulation report
        if: always()
        working-directory: ./backend
        run: |
          echo "Simulation completed at $(date)"
          echo "Report will be available in audit logs"
      
      - name: Upload audit logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-audit-logs
          path: backend/logs/
          retention-days: 30
      
      - name: Comment on commit (if simulation failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ User simulation failed. Check the logs for details.'
            })
