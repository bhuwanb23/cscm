name: User Simulation

on:
  schedule:
    # 3x daily during business hours. Deliberately offset from :00/:30 —
    # GitHub coalesces/drops runs queued on the hour.
    - cron: '20 9,14,19 * * *'
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest
    # Hard cap: the simulation loop must never pin a runner for hours
    # (runContinuousSimulation has no built-in stop condition).
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Fail fast if deployment secrets are missing
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AI_ML_API_KEY: ${{ secrets.AI_ML_API_KEY }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Secret BACKEND_URL is not configured on this repository."
            exit 1
          fi
          if [ -z "$AI_ML_API_KEY" ]; then
            echo "::error::Secret AI_ML_API_KEY is not configured on this repository."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --omit=dev

      - name: Run user simulation
        working-directory: ./backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AI_ML_API_URL: ${{ secrets.AI_ML_API_URL }}
          AI_ML_API_KEY: ${{ secrets.AI_ML_API_KEY }}
          # Seeded demo users share one documented password (scripts/seed-history.js).
          # Without it every login fails and the run produces no real traffic.
          SIM_USER_PASSWORD: ${{ secrets.SIM_USER_PASSWORD || 'Cscm!Demo2026' }}
        run: node src/simulation/index.js --continuous

      - name: Generate simulation report
        if: always()
        working-directory: ./backend
        run: |
          echo "Simulation completed at $(date)"
          echo "Report will be available in audit logs"

      - name: Upload audit logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-audit-logs
          path: backend/logs/
          retention-days: 30
