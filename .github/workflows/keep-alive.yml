name: Keep Services Alive

on:
  schedule:
    # Every 30 minutes, 08:00-21:00 UTC — keeps free Render services warm
    # while staying inside the GitHub Actions free tier (2000 min/month):
    #   ~2 min × 28 runs/day × 30 days = ~1680 min/month.
    - cron: '*/30 8-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all services
        run: |
          fail=0
          for url in \
            https://cscm-backend.onrender.com/health \
            https://cscm-gateway.onrender.com/health \
            https://cscm-aiml.onrender.com/health \
            https://cscm-dashboard.onrender.com/api/health
          do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url -> $code"
              fail=1
            else
              echo "$url -> 200"
            fi
          done
          exit $fail
